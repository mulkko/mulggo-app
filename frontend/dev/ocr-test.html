<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>[테스트] 사업자등록증 OCR</title>
</head>
<body>
  <h1>사업자등록증 OCR 테스트</h1>
  <p>
    정식 회원가입 플로우와 무관한 단독 검증용 페이지입니다.<br>
    DB에는 저장하지 않고, 결과를 <code>data/test_uploads/biz_registration_ocr_test.csv</code>에 한 줄씩 기록합니다.
  </p>

  <input type="file" id="fileInput" accept="image/*,.pdf">
  <button id="uploadBtn" type="button">업로드 및 OCR 실행</button>

  <h2>결과</h2>
  <pre id="result" style="background:#f4f4f4; padding:12px; white-space:pre-wrap;">(아직 업로드 안 함)</pre>

  <script>
    const API_BASE_URL = "http://127.0.0.1:8000";

    // OCR 실패 종류(error_type, backend/api/test_ocr.py에서 내려줌)별 안내 문구.
    // - file_error: 파일 자체를 못 염 (손상/미지원 형식)
    // - pdf_error: PDF -> 이미지 변환 실패 (서버 poppler 미설치 등)
    // - recognition_error: 모델이 사진은 읽었지만 정해진 JSON 형식으로 답을 못 줌
    //   (어둡거나 흐릿한 사진에서 자주 발생 — 사용자가 재촬영하면 해결될 수 있음)
    // - gpu_error: GPU 연산 중 크래시(CUDA device-side assert 등). 서버/모델 쪽 문제로,
    //   사용자가 사진을 바꿔도 해결 안 될 수 있음 — 서버 로그 확인 필요
    // - unknown_error: 위 네 가지로 분류 안 되는 나머지 전부
    const ERROR_ALERTS = {
      file_error: "[파일 오류] 이미지가 손상되었거나 지원하지 않는 형식입니다.",
      pdf_error: "[PDF 변환 오류] 서버에서 PDF를 이미지로 변환하지 못했습니다.",
      recognition_error: "[인식 실패] 사업자등록증을 인식하지 못했습니다. 밝고 선명한 사진으로 다시 시도해주세요.",
      gpu_error: "[서버 오류] GPU 처리 중 문제가 발생했습니다. 잠시 후 다시 시도해주세요.",
      unknown_error: "[알 수 없는 오류] 원인 불명의 오류가 발생했습니다.",
    };

    document.getElementById("uploadBtn").addEventListener("click", async () => {
      const fileInput = document.getElementById("fileInput");
      const resultEl = document.getElementById("result");

      if (!fileInput.files.length) {
        resultEl.textContent = "파일을 먼저 선택하세요.";
        return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      const startedAt = performance.now();
      let timerId = setInterval(() => {
        const elapsed = ((performance.now() - startedAt) / 1000).toFixed(1);
        resultEl.textContent = `처리 중... (${elapsed}초 경과, OCR 모델 로딩 포함)`;
      }, 100);

      try {
        const response = await fetch(`${API_BASE_URL}/api/test/ocr-upload`, {
          method: "POST",
          body: formData,
        });
        const data = await response.json();
        clearInterval(timerId);
        const elapsed = ((performance.now() - startedAt) / 1000).toFixed(1);
        resultEl.textContent = `소요 시간: ${elapsed}초\n\n` + JSON.stringify(data, null, 2);

        if (!data.ocr_success) {
          const msg = ERROR_ALERTS[data.error_type] || ERROR_ALERTS.unknown_error;
          alert(msg);
        }
      } catch (err) {
        clearInterval(timerId);
        const elapsed = ((performance.now() - startedAt) / 1000).toFixed(1);
        resultEl.textContent = `요청 실패 (${elapsed}초 경과): ` + err;
      }
    });
  </script>
</body>
</html>
