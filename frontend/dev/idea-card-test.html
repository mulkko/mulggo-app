<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>[테스트] 사업 구체화 아이디어 카드 생성</title>
</head>
<body>
  <h1>아이디어 카드 생성 테스트</h1>
  <p>
    정식 슬롯필링 화면(프론트)이 아직 없어서 만든 단독 검증용 페이지입니다.<br>
    DB에는 아무것도 저장하지 않고, 입력한 슬롯 4개로 아이디어 카드가 잘 나오는지만 확인합니다.
  </p>

  <p>
    서버 주소:
    <input type="text" id="apiBaseInput" style="width:240px;">
    <button id="apiBaseSaveBtn" type="button">저장</button>
  </p>

  <div style="max-width:480px;">
    <label style="display:block; margin-top:12px;">타깃</label>
    <textarea id="target" rows="2" style="width:100%;" placeholder="예: 노트북 작업하는 20~30대 직장인·프리랜서"></textarea>

    <label style="display:block; margin-top:12px;">차별점</label>
    <textarea id="differentiator" rows="2" style="width:100%;"></textarea>

    <label style="display:block; margin-top:12px;">수익모델</label>
    <textarea id="revenue_model" rows="2" style="width:100%;"></textarea>

    <label style="display:block; margin-top:12px;">보유역량</label>
    <textarea id="core_skill" rows="2" style="width:100%;" placeholder="예: 바리스타 경력 5년"></textarea>
  </div>

  <button id="submitBtn" type="button" style="margin-top:16px;">아이디어 카드 생성</button>

  <h2>결과</h2>
  <pre id="result" style="background:#f4f4f4; padding:12px; white-space:pre-wrap;">(아직 실행 안 함)</pre>

  <script>
    // ocr-test.html과 동일한 방식: 팀원마다 PC가 달라서 서버 주소를 저장해두고 재사용.
    function resolveApiBaseUrl() {
      const saved = localStorage.getItem("idea_card_api_base_url");
      if (saved) return saved;

      const host = window.location.hostname;
      if (host && host !== "localhost" && host !== "127.0.0.1") {
        return `http://${host}:8000`;
      }
      return "http://127.0.0.1:8000";
    }

    let API_BASE_URL = resolveApiBaseUrl();

    const apiBaseInput = document.getElementById("apiBaseInput");
    apiBaseInput.value = API_BASE_URL;
    document.getElementById("apiBaseSaveBtn").addEventListener("click", () => {
      const val = apiBaseInput.value.trim().replace(/\/$/, "");
      if (!val) return;
      localStorage.setItem("idea_card_api_base_url", val);
      API_BASE_URL = val;
      alert("저장했어요. 이제부터 이 주소로 요청을 보냅니다: " + val);
    });

    document.getElementById("submitBtn").addEventListener("click", async () => {
      const resultEl = document.getElementById("result");
      const payload = {
        target: document.getElementById("target").value,
        differentiator: document.getElementById("differentiator").value,
        revenue_model: document.getElementById("revenue_model").value,
        core_skill: document.getElementById("core_skill").value,
      };

      resultEl.textContent = "처리 중... (LLM 호출 포함, 몇 초 걸릴 수 있습니다)";

      try {
        const response = await fetch(`${API_BASE_URL}/api/test/idea-cards`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await response.json();
        resultEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultEl.textContent = "요청 실패: " + err;
      }
    });
  </script>
</body>
</html>
