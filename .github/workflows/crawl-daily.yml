name: crawl-daily

# 매일 원본 공고 수집: 창업진흥원(K-Startup) 오픈 API -> announcements_raw_kstartup 테이블.
# raw 적재만 한다. raw -> announcements 통합 가공(backend/preprocessing/sync_*)은 이 워크플로에 없음 (다른 담당자 몫, 이 자동화 범위 밖).
#
# 기업마당(bizinfo)은 여기 없다: www.bizinfo.go.kr 이 해외 IP 접속을 막아서 GitHub 러너(미국)에서
# 접속 타임아웃이 난다. 기업마당 수집은 한국에 있는 PC의 작업 스케줄러로 매일 04:00에 돌린다
# (scripts/crawl_bizinfo.bat, scripts/README.md 참고).

on:
  schedule:
    # KST 04:00 = UTC 19:00 (한국은 서머타임 없음)
    - cron: "0 19 * * *"
  workflow_dispatch: {}

concurrency:
  group: crawl-daily
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 스크립트가 os.getenv("KStartup_API_KEY") 로 읽으므로 env 키 대소문자를 그대로 맞춘다.
      KStartup_API_KEY: ${{ secrets.KSTARTUP_API_KEY }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # runtime.txt 기준
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl K-Startup (창업진흥원) -> announcements_raw_kstartup
        run: python -m backend.crawler.kst_api
