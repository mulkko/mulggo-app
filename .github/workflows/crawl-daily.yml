name: crawl-daily

# 매일 원본 공고 수집: 기업마당(bizinfo) / 창업진흥원(K-Startup) API -> announcements_raw_* 테이블.
# raw 적재만 한다. raw -> announcements 통합 가공(backend/preprocessing/sync_*)은 이 워크플로에 없음
#   - kstartup 전처리: 넣을 수 있으나 팀 결정 보류(가벼움, OCR 없음)
#   - bizinfo 전처리: 첨부 OCR로 수 시간 걸려서 GPU PC 자체 스케줄러(KST 04:00)로 별도 실행

on:
  schedule:
    # KST 03:00 = UTC 18:00 (한국은 서머타임 없음). GPU PC의 bizinfo 전처리(KST 04:00)보다 먼저 끝나도록 앞에 둔다.
    - cron: "0 18 * * *"
  workflow_dispatch: {}

concurrency:
  group: crawl-daily
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
      # 스크립트가 os.getenv("KStartup_API_KEY") 로 읽으므로 env 키 대소문자를 그대로 맞춘다.
      KStartup_API_KEY: ${{ secrets.KSTARTUP_API_KEY }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # runtime.txt 기준
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl bizinfo (기업마당) -> announcements_raw_bizinfo
        run: python -m backend.crawler.bizinfo_api

      - name: Crawl K-Startup (창업진흥원) -> announcements_raw_kstartup
        # 앞 step(bizinfo)이 실패해도 실행한다. 두 소스는 서로 독립.
        if: always()
        run: python -m backend.crawler.kst_api
