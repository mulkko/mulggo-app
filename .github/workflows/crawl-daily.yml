name: crawl-daily

# 매일 원본 공고 수집: 창업진흥원(K-Startup) 오픈 API -> announcements_raw_kstartup 테이블.
# raw 적재만 한다. raw -> announcements 통합 가공(backend/preprocessing/sync_*)은 이 워크플로에 없음 (다른 담당자 몫, 이 자동화 범위 밖).
#
# 기업마당(bizinfo)은 여기 없다: www.bizinfo.go.kr 이 해외 IP 접속을 막아서 GitHub 러너(미국)에서
# 접속 타임아웃이 난다. 기업마당 수집은 한국에 있는 PC의 작업 스케줄러로 매일 04:00에 돌린다
# (scripts/crawl_bizinfo.bat, scripts/README.md 참고).
#
# [2026-09-12] 스케줄 트리거 비활성화함: KST 04:07로 정각을 피해 조정했는데도
# 9/11, 9/12 이틀 연속 실제 시작이 06:30~07:00대로 몇 시간씩 밀렸고, 그 시점에
# data.go.kr 게이트웨이 응답까지 없어서 크롤이 error로 끝났음 (crawl_batch_logs 확인).
# GitHub Actions 스케줄 트리거는 혼잡 시 지연이 공식적으로 보장되지 않는 best-effort라
# 분(minute)을 옮기는 걸로는 해결이 안 돼서, kstartup도 bizinfo와 동일하게 로컬 PC
# 작업 스케줄러로 옮겼다 (scripts/crawl_kstartup.bat, scripts/README.md 참고).
# 이 워크플로는 나중에 다시 쓸 수도 있어 삭제하지 않고 남겨두되, 예약 실행만 끈다.
# 필요하면 아래 schedule 블록 주석을 풀어서 재활성화하면 된다. 수동 실행(workflow_dispatch)은 그대로 가능.

on:
  # schedule:
  #   # KST 04:07 = UTC 19:07 (한국은 서머타임 없음)
  #   - cron: "7 19 * * *"
  workflow_dispatch: {}

concurrency:
  group: crawl-daily
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 스크립트가 os.getenv("KStartup_API_KEY") 로 읽으므로 env 키 대소문자를 그대로 맞춘다.
      KStartup_API_KEY: ${{ secrets.KSTARTUP_API_KEY }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # runtime.txt 기준
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl K-Startup (창업진흥원) -> announcements_raw_kstartup
        run: python -m backend.crawler.kst_api
