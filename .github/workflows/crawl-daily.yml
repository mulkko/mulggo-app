name: crawl-daily

# 매일 원본 공고 수집: 기업마당(bizinfo) / 창업진흥원(K-Startup) API -> announcements_raw_* 테이블.
# raw 적재만 한다. raw -> announcements 통합 가공(backend/preprocessing/sync_*)은 이 워크플로에 없음 (다른 담당자 몫, 이 자동화 범위 밖)
#   - kstartup 전처리: 포함하지 않음 (최종 확정)
#   - bizinfo 전처리: 첨부 OCR로 수 시간 걸려서 GPU PC 자체 스케줄러로 별도 실행 (시각 미정, 이 워크플로와 무관)

on:
  schedule:
    # KST 04:00 = UTC 19:00 (한국은 서머타임 없음)
    - cron: "0 19 * * *"
  workflow_dispatch: {}

concurrency:
  group: crawl-daily
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
      # 스크립트가 os.getenv("KStartup_API_KEY") 로 읽으므로 env 키 대소문자를 그대로 맞춘다.
      KStartup_API_KEY: ${{ secrets.KSTARTUP_API_KEY }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # runtime.txt 기준
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl bizinfo (기업마당) -> announcements_raw_bizinfo
        run: python -m backend.crawler.bizinfo_api

      - name: Crawl K-Startup (창업진흥원) -> announcements_raw_kstartup
        # 앞 step(bizinfo)이 실패해도 실행한다. 두 소스는 서로 독립.
        if: always()
        run: python -m backend.crawler.kst_api
